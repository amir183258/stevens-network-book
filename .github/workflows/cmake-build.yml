name: CMake Build Pipeline

on:
  push:
    branches[ "main", "master" ]
  pull_request:
    branches[ "main", "master" ]

jobs:
  build-process:
    runs-on: ubuntu-latest

    steps:
      name: Checkout code
      uses: actions/checkout@v4

      name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

      name: Configure and Build
      run: |
        mkdir build
        cd build
        cmake ..
        make
